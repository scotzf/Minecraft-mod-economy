# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# NOTE: there is deliberately no `org.gradle.java.home` here any more.
# A hardcoded absolute path was wrong on two different machines in a row —
# it was a Windows Temurin path that broke on Linux, then a Linux path that
# would have broken on Windows. `java.toolchain` in build.gradle now asks
# Gradle to FIND a JDK 25 itself, which works on both.
#
# If Gradle can't find one it will say so; install a JDK 25 (not a JRE — the
# JRE has no compiler) and it will be auto-detected:
#   Linux:   sudo apt install openjdk-25-jdk
#   Windows: winget install EclipseAdoptium.Temurin.25.JDK

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=26.2
loader_version=0.19.3
loom_version=1.17.20

# Mod Properties
version=1.0.0
group=com.pisomarket

# Dependencies
fabric_api_version=0.158.0+26.2
