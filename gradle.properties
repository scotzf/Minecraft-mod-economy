# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# Points Gradle at Temurin JDK 25 explicitly — the machine's default `java` on
# PATH is still 1.8, so without this Gradle picks the wrong JVM. Remove this
# line if JDK 25 is ever made the system default instead.
org.gradle.java.home=C\:\\Program Files\\Eclipse Adoptium\\jdk-25.0.4.101-hotspot

# Fabric Properties
# check these on https://fabricmc.net/develop
minecraft_version=26.2
loader_version=0.19.3
loom_version=1.17.20

# Mod Properties
version=1.0.0
group=com.pisomarket

# Dependencies
fabric_api_version=0.158.0+26.2
